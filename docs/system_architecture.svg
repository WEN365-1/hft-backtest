<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
.t{font:700 22px 'Microsoft YaHei',sans-serif;fill:#14213d}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#41516b}.a{font:15px 'Microsoft YaHei',sans-serif;fill:#34445c}.h{font:700 32px 'Microsoft YaHei',sans-serif;fill:#102a43}.l{font:16px 'Microsoft YaHei',sans-serif;fill:#41516b}.box{stroke-width:2;rx:14}.shared{fill:#edf5ff;stroke:#3874cb}.live{fill:#fff4e5;stroke:#df8b22}.future{fill:#f3f5f7;stroke:#8795a5;stroke-dasharray:7 5}.arrow{stroke:#52667d;stroke-width:2;fill:none;marker-end:url(#m)}
</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52667d"/></marker></defs>
<rect width="1400" height="900" fill="#fbfcfe"/><text x="60" y="58" class="h">高频回测系统结构｜第二课行情闭环</text>
<text x="60" y="91" class="s">蓝色：回测 / 实盘共用　橙色：实盘替换为真实交易所　灰色虚线：下一课接口</text>
<rect x="60" y="135" width="250" height="120" class="box shared"/><text x="85" y="174" class="t">行情采集</text><text x="85" y="205" class="s">Spot / USD-M WebSocket</text><text x="85" y="232" class="s">depth · aggTrade · snapshot</text>
<rect x="410" y="135" width="250" height="120" class="box shared"/><text x="435" y="174" class="t">分区存储</text><text x="435" y="205" class="s">Parquet / 市场 / 日期 / 小时</text><text x="435" y="232" class="s">事件 + E / T / 本地接收时间</text>
<rect x="760" y="135" width="250" height="120" class="box shared"/><text x="785" y="174" class="t">模拟交易所</text><text x="785" y="205" class="s">流式回放 / 订阅 / 异常隔离</text><text x="785" y="232" class="s">本课：行情；下课：撮合</text>
<rect x="1110" y="135" width="230" height="120" class="box live"/><text x="1135" y="174" class="t">真实交易所</text><text x="1135" y="205" class="s">实盘行情 / 下单网关</text><text x="1135" y="232" class="s">替换数据源与执行端</text>
<path d="M310 195 H410" class="arrow"/><text x="323" y="181" class="a">追加事件批次</text>
<path d="M660 195 H760" class="arrow"/><text x="669" y="181" class="a">有序事件流</text>
<path d="M1225 255 V300 H185 V255" class="arrow"/><text x="625" y="290" class="a">实时 depth / trade / snapshot（仅替换 source）</text>
<rect x="760" y="355" width="250" height="120" class="box shared"/><text x="785" y="394" class="t">内部订单簿</text><text x="785" y="425" class="s">快照 + 增量同步</text><text x="785" y="452" class="s">gap 暂停 / 重同步</text>
<path d="M885 255 V355" class="arrow"/><text x="900" y="314" class="a">重建 / 校验</text>
<rect x="390" y="355" width="270" height="120" class="box shared"/><text x="415" y="394" class="t">策略（可多实例）</text><text x="415" y="425" class="s">on_book / on_trade / on_status</text><text x="415" y="452" class="s">信号 → 评分 / 目标仓位</text>
<path d="M760 415 H660" class="arrow"/><text x="664" y="400" class="a">L2 簿 / 成交 / 状态</text>
<rect x="60" y="355" width="230" height="120" class="box future"/><text x="85" y="394" class="t">订单管理 OMS</text><text x="85" y="425" class="s">指令 / 状态机 / 撤改单</text><text x="85" y="452" class="s">下一课实现</text>
<path d="M390 415 H290" class="arrow"/><text x="294" y="400" class="a">订单意图</text>
<rect x="60" y="565" width="230" height="120" class="box future"/><text x="85" y="604" class="t">风控</text><text x="85" y="635" class="s">仓位 / 名义额 / 频率</text><text x="85" y="662" class="s">通过或拒绝</text>
<path d="M175 475 V565" class="arrow"/><text x="190" y="526" class="a">待检查订单</text>
<rect x="390" y="565" width="270" height="120" class="box future"/><text x="415" y="604" class="t">执行 / 撮合</text><text x="415" y="635" class="s">走档 / 排队 / 延迟 / 费用</text><text x="415" y="662" class="s">回测撮合；实盘真实网关</text>
<path d="M290 625 H390" class="arrow"/><text x="300" y="610" class="a">合规订单</text>
<path d="M660 625 H730 V500 H835 V475" class="arrow"/><text x="675" y="553" class="a">模拟订单 / 撤单</text>
<path d="M525 565 V510 H1110 V475 H1225 V255" class="arrow"/><text x="895" y="496" class="a">实盘订单</text>
<rect x="760" y="565" width="250" height="120" class="box future"/><text x="785" y="604" class="t">账户</text><text x="785" y="635" class="s">现金 / 持仓 / 保证金</text><text x="785" y="662" class="s">成交后原子更新</text>
<path d="M660 625 H760" class="arrow"/><text x="673" y="610" class="a">成交回报</text>
<rect x="1110" y="565" width="230" height="120" class="box shared"/><text x="1135" y="604" class="t">监控与评估</text><text x="1135" y="635" class="s">延迟 / gap / 一致率</text><text x="1135" y="662" class="s">PnL / 回撤 / 告警</text>
<path d="M1010 625 H1110" class="arrow"/><text x="1019" y="610" class="a">账户快照</text>
<path d="M885 475 V520 H1110 V565" class="arrow"/><text x="920" y="510" class="a">订单簿质量指标</text>
<path d="M1225 475 V565" class="arrow"/><text x="1240" y="526" class="a">真实回报</text>
<rect x="60" y="770" width="1280" height="75" rx="12" fill="#eef8f1" stroke="#4b9560"/><text x="85" y="802" class="t">共用核心原则</text><text x="85" y="830" class="s">策略只依赖统一回调与订单接口；切换回放 / 实时数据源，不改策略。任何未来事件不得进入当前决策。</text>
</svg>